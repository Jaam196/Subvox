name: Compilar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compilar APK de depuración
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/SubVox-${GITHUB_REF_NAME//\//-}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SubVox-apk
          path: dist/*.apk

      - name: Publicar Release (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
