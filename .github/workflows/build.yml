name: Compilar APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la Release a la que adjuntar el APK (opcional)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compilar APK de depuración
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/SubVox-${GITHUB_REF_NAME//\//-}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SubVox-apk
          path: dist/*.apk

      - name: Adjuntar APK a la Release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/*.apk
